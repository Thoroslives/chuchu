name: Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - deploy
      - test-66-fix

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Warm nix shell
        run: nix develop -L --verbose -c true
      - name: Build chuchu_jni (Zig native lib)
        run: |
          nix develop -c bash -c '
            set -e
            cd zig-src
            zig build -Doptimize=ReleaseSmall jni
          '
      - name: Build debug APK
        run: |
          nix develop -c bash -c '
            set -e
            cd android
            chmod +x ./gradlew
            ./gradlew assembleDebug
          '
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chuchu-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish prerelease for Obtainium
        uses: softprops/action-gh-release@v1
        with:
          tag_name: deploy-latest
          name: "Chuchu deploy build (Thoroslives fork)"
          body: |
            Personal build of the Thoroslives/chuchu deploy branch: upstream
            plus salemsayed's PR #73 mosh-freeze fix plus in-progress features
            (keep screen awake, #68). Debug-signed. Not for general use.
          prerelease: true
          files: android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
      - name: Unit tests
        run: |
          nix develop -c bash -c '
            set -e
            cd android
            ./gradlew app:testDebugUnitTest
          '
